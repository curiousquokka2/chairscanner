name: govcon-mcp tests

on:
  push:
    paths: ["gov-connectors/**", ".github/workflows/govcon-tests.yml"]
  pull_request:
    paths: ["gov-connectors/**", ".github/workflows/govcon-tests.yml"]

permissions:
  contents: read

# Every `uses:` is pinned to a full commit SHA (tags are mutable). SHAs resolved 2026-11-20 with
# `git ls-remote` and cross-checked against each project's release notes. Dependabot
# (github-actions ecosystem) proposes SHA bumps; review the release notes before merging one.
# Versions chosen 2026-11-20 from release notes: Node 20 was removed from hosted runners on
# 2026-09-16, so checkout@v4 / setup-python@v5 / gitleaks-action@v2 no longer run.
# gitleaks-action is proprietary-licensed since v2; free for personal-account repos (this one).
# If the repo moves to an organization, add a free GITLEAKS_LICENSE secret (gitleaks.io).

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gov-connectors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked, hash-verified dependencies
        run: |
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .
      - run: pytest -q
      - name: Mutation check (every security control must have a failing test)
        run: python scripts/mutation_check.py
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements-lock.txt --require-hashes --disable-pip

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
