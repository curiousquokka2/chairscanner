[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "govcon-mcp"
version = "0.1.0"
description = "MCP custom-connector server for government contracting data (USAspending, SAM.gov, GSA CALC+, SBIR.gov, Tango, SLED open data)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Pinned to major versions; lock exact versions (pip-compile / uv lock) for deployment.
dependencies = [
  "mcp>=2.3,<3",
  "httpx2>=2.13,<3",
  "pydantic>=2.7,<3",
  "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]  # async tests use the anyio pytest plugin

[project.scripts]
govcon-mcp = "govcon_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real government APIs (needs network + keys); skipped by default"]
addopts = "-m 'not live'"
